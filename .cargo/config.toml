# =============================================================================
# Cargo configuration for the sniper workspace.
#
# Aliases keep the chapter-by-chapter commands short enough to type without
# thinking, which matters when the workflow is "run the autotest for this
# chapter, then commit".
# =============================================================================

[alias]
# --- test loop ---------------------------------------------------------------
# Debug build of the whole workspace: the loop used while writing a chapter.
t = "test --workspace"
# Release build: mandatory before any latency measurement. Numbers from a
# debug build are meaningless and worse than no numbers at all.
tr = "test --workspace --release"
# The production-shaped build used for benchmarking and deployment.
b = "build --workspace --release"
# --- quality gates -----------------------------------------------------------
f = "fmt --all"
c = "clippy --workspace --all-targets -- -D warnings"
# --- chapter automation ------------------------------------------------------
# Chapter 0's autotest system: environment preflight. Zero dependencies, so it
# always builds even when the Solana tree is broken.
gate = "run -p xtask --bin gatekeeper -- gatekeeper"
# Chapter 1's setup step: fetch the real pump.fun binary for the LiteSVM stand.
dump-pump = "run -p xtask --bin gatekeeper -- dump-pump"
# Chapter 2's ground truth: capture real mainnet transactions as test fixtures.
fetch-fixtures = "run -p xtask --bin fetch-fixtures --"
# Live detection on mainnet. Release by default: a debug build's latency numbers
# are not merely worse, they are a different universe, and this tool's whole
# purpose is measuring how fast a launch is seen.
watch = "run -p sniper-cli --bin watch-launches --release --"
# Chapter 6's evidence: sample live launches and report what their mint accounts
# actually contain, so filter thresholds come from data rather than intuition.
risk-probe = "run -p sniper-cli --bin risk-probe --release --"
# Read the bonding curve the instant a launch is seen: how far along it is,
# what 0.02 SOL costs in it, and whether the supply figure on chain agrees with
# what the rest of the project assumed.
curve-probe = "run -p sniper-cli --bin curve-probe --release --"
# The only probe that produces a number rather than a description: what a 0.02
# SOL entry at detection would actually have returned at each horizon, priced
# with the SDK's own maths on real curve state.
pnl-probe = "run -p sniper-cli --bin pnl-probe --release --"

[build]
# Keep incremental compilation off for release: a sniper binary is small and
# built rarely, and incremental artifacts have no value in production.
incremental = true

[term]
color = "always"

[net]
# Fail fast instead of hanging a build behind a dead mirror.
retry = 5

[http]
# Slow links are not dead links. The default 30s timeout gives up on a
# perfectly healthy crates.io mirror that happens to be mid-transfer, and the
# symptom is a confusing "transfer too slow: transferred 0 bytes" on a
# dependency that is only a few hundred kilobytes. Raising the timeout turns
# those into ordinary slow builds instead of random failures.
timeout = 120
# Multiplexing shares one connection across concurrent downloads, which is a
# large win when fetching the ~200 crates the Solana tree pulls in. It is
# disabled here because a single reset on a multiplexed connection fails every
# request sharing it, which looks worse on a flaky link than it saves on a fast
# one.
multiplexing = false