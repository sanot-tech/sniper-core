[package]
name = "sniper-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Sniper bot executable: runtime flags and process supervision entry point."

[dependencies]
sniper-core = { path = "../core", version = "0.1.0" }
sniper-telemetry = { path = "../telemetry", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
bs58 = "0.5"
# Bonding curve account decoding. The layout is Anchor's, with a discriminator
# and borsh fields; hand-rolled offsets would break the moment the program adds
# an account field.
pump-rust-client = { version = "0.2", default-features = false }

[lints]
workspace = true