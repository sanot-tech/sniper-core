[package]
name = "sniper-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Venue adapters, decoding, pricing, risk filtering, execution and position management for the Solana sniper."

[dependencies]
sniper-telemetry = { path = "../telemetry", version = "0.1.0" }
# Official pump.fun SDK: the curve maths itself, so our own arithmetic only
# has to be right where it is genuinely ours — fee handling, caps and rounding.
pump-rust-client = { version = "0.2", default-features = false }

[lints]
workspace = true

[dev-dependencies]
sniper-telemetry = { path = "../telemetry", version = "0.1.0" }
# Only for DecodeMatrix: reading captured fixtures, not part of the hot path.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
# Property tests for the curve maths. A deterministic seed is configured in
# tests/math_invariants.rs so a failure is always reproducible.
proptest = "1"