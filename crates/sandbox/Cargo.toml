[package]
name = "sniper-sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "SandboxForge: an in-process Solana VM running the real dumped pump.fun program, so instruction building can be verified for free in milliseconds."

[dependencies]
sniper-telemetry = { path = "../telemetry", version = "0.1.0" }
# In-process SVM. Chosen over solana-test-validator because it needs no ports,
# no ledger and no background process: a test that finishes in milliseconds is
# a test people actually run.
litesvm = "0.17"

# Interfaces only, so the sandbox stays small and version-compatible with
# whatever litesvm itself pins.
solana-keypair = "3"
solana-signer = "3"
solana-instruction = "3"
solana-message = "4"
solana-address = "2"
solana-sha256-hasher = "3"
solana-account = "5"
solana-native-token = "3"
solana-system-interface = "3"
# Clock sysvar is the only public way to read the sandbox's current slot.
solana-clock = "3"
# In Agave 4.x the ComputeBudget instruction builders moved here; the
# solana-compute-budget-instruction crate now only ships the processor side.
solana-compute-budget-interface = "3"
# VersionedTransaction is the wire type that carries serde, which is exactly
# what chapter 4's goldens need in order to compare real bytes.
solana-transaction = { version = "4", features = ["serde"] }
# Wire serialisation.
bincode = "1.3"
# solana-sbpf exposes the loader constants the synthesised stub has to agree with.
# Test-only in spirit: the stub hard-codes them deliberately, and a unit test
# asserts they still match, so a dependency bump fails as a clear assertion
# rather than as a parse error from inside LiteSVM.
solana-sbpf = "0.23"

# hex is used by the library, not only by tests, so it belongs here.
hex = "0.4"
# Needed only to turn a 32-byte fixture seed into the 64-byte secret key that
# solana_keypair::Keypair::try_from expects (seed || public key).
ed25519-dalek = "2"

bs58 = "0.5"

# The determinism suite needs the same types the library uses, as
# dev-dependencies rather than as new regular ones: nothing here should be
# visible to a consumer of the crate, and the types are already there.
[dev-dependencies]
solana-instruction = "3"
solana-keypair = "3"
solana-address = "2"
solana-native-token = "3"
solana-system-interface = "3"

[lints]
workspace = true
